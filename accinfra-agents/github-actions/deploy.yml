# ──────────────────────────────────────────────────────────────────────────────
# AccInfra — Terraform Deploy Pipeline
# ──────────────────────────────────────────────────────────────────────────────
# Triggered when an infra/issue-* PR is merged into main.
# Runs: terraform init → plan → apply
# Uses GitHub OIDC to assume the deploy role (no stored secrets).
#
# Copy this file to: .github/workflows/accinfra-deploy.yml in the target repo.
# ──────────────────────────────────────────────────────────────────────────────

name: "AccInfra: Terraform Deploy"

on:
  push:
    branches:
      - main
    paths:
      - "infrastructure/issue-*.tf"

  # Allow manual trigger for re-runs
  workflow_dispatch:
    inputs:
      terraform_action:
        description: "Terraform action to run"
        required: true
        default: "apply"
        type: choice
        options:
          - plan
          - apply

# Ensure only one deploy runs at a time (prevent state conflicts)
concurrency:
  group: terraform-deploy
  cancel-in-progress: false

# OIDC token permissions for AWS role assumption
permissions:
  id-token: write
  contents: read
  issues: write
  pull-requests: write

env:
  # ─── Demo values (Account A: 027378719919, us-east-1) ───
  AWS_REGION: "us-east-1"
  DEPLOY_ROLE_ARN: "arn:aws:iam::027378719919:role/accinfra-deploy-role"
  TF_STATE_BUCKET: "accinfra-tfstate-027378719919"
  TF_STATE_KEY: "infra/terraform.tfstate"
  TF_LOCK_TABLE: "accinfra-tfstate-lock"
  TF_WORKING_DIR: "infrastructure"
  TERRAFORM_VERSION: "1.9.0"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Terraform Plan (always runs)
  # ─────────────────────────────────────────────────────────────────────────────
  plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: accinfra-deploy-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -detailed-exitcode \
            -out=tfplan \
            -no-color 2>&1 | tee plan_output.txt
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/plan_output.txt
          retention-days: 5

      - name: Comment plan on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan_output.txt', 'utf8');
            const truncated = output.length > 60000 ? output.substring(0, 60000) + '\n... (truncated)' : output;
            
            const body = `## Terraform Plan Output
            
            \`\`\`hcl
            ${truncated}
            \`\`\`
            
            *Plan generated by AccInfra Deploy pipeline*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Terraform Apply (only on push to main or manual dispatch)
  # ─────────────────────────────────────────────────────────────────────────────
  apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    needs: plan
    # Only apply if plan succeeded and detected changes (exit code 2 = changes present)
    if: |
      (github.event_name == 'push' || 
       (github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'apply'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: accinfra-deploy-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform Apply
        id: apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply \
            -auto-approve \
            -no-color 2>&1 | tee apply_output.txt

      - name: Extract deployed resources
        if: success()
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform show -json | jq -r '
            .values.root_module.resources[]? |
            select(.values.tags.ManagedBy == "accinfra-agents") |
            "\(.type) | \(.name) | \(.values.id // .values.arn // "N/A")"
          ' > deployed_resources.txt || echo "No resources found" > deployed_resources.txt
          
          echo "## Deployed Resources" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat deployed_resources.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload apply output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-apply
          path: |
            ${{ env.TF_WORKING_DIR }}/apply_output.txt
            ${{ env.TF_WORKING_DIR }}/deployed_resources.txt
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Notify on failure
  # ─────────────────────────────────────────────────────────────────────────────
  notify-failure:
    name: "Notify on Failure"
    runs-on: ubuntu-latest
    needs: [plan, apply]
    if: failure()

    steps:
      - name: Post failure to job summary
        run: |
          echo "## ❌ Deployment Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The AccInfra terraform deploy pipeline failed." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run ID:** ${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Triggered by:** ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the individual job logs above for details." >> "$GITHUB_STEP_SUMMARY"
