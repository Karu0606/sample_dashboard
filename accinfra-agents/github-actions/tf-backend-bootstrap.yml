# ──────────────────────────────────────────────────────────────────────────────
# AccInfra — Terraform Backend Bootstrap
# ──────────────────────────────────────────────────────────────────────────────
# One-time workflow to create the S3 bucket + DynamoDB table for Terraform state.
# Run this ONCE before the first deploy. Manual trigger only.
#
# Copy this file to: .github/workflows/accinfra-tf-bootstrap.yml in the target repo.
# ──────────────────────────────────────────────────────────────────────────────

name: "AccInfra: Bootstrap Terraform Backend"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'bootstrap' to confirm backend creation"
        required: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"
  DEPLOY_ROLE_ARN: "arn:aws:iam::027378719919:role/accinfra-deploy-role"
  TF_STATE_BUCKET: "accinfra-tfstate-027378719919"
  TF_LOCK_TABLE: "accinfra-tfstate-lock"

jobs:
  bootstrap:
    name: "Create S3 Bucket + DynamoDB Lock Table"
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'bootstrap'

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: accinfra-bootstrap-${{ github.run_id }}

      - name: Create S3 state bucket
        run: |
          # Create bucket (skip if exists)
          aws s3api create-bucket \
            --bucket "${{ env.TF_STATE_BUCKET }}" \
            --region "${{ env.AWS_REGION }}" \
            --create-bucket-configuration LocationConstraint="${{ env.AWS_REGION }}" \
            2>/dev/null || echo "Bucket already exists"

          # Enable versioning
          aws s3api put-bucket-versioning \
            --bucket "${{ env.TF_STATE_BUCKET }}" \
            --versioning-configuration Status=Enabled

          # Enable encryption
          aws s3api put-bucket-encryption \
            --bucket "${{ env.TF_STATE_BUCKET }}" \
            --server-side-encryption-configuration '{
              "Rules": [{
                "ApplyServerSideEncryptionByDefault": {
                  "SSEAlgorithm": "AES256"
                },
                "BucketKeyEnabled": true
              }]
            }'

          # Block public access
          aws s3api put-public-access-block \
            --bucket "${{ env.TF_STATE_BUCKET }}" \
            --public-access-block-configuration '{
              "BlockPublicAcls": true,
              "IgnorePublicAcls": true,
              "BlockPublicPolicy": true,
              "RestrictPublicBuckets": true
            }'

          echo "✅ S3 bucket ready: ${{ env.TF_STATE_BUCKET }}"

      - name: Create DynamoDB lock table
        run: |
          aws dynamodb create-table \
            --table-name "${{ env.TF_LOCK_TABLE }}" \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --region "${{ env.AWS_REGION }}" \
            --tags Key=ManagedBy,Value=accinfra-agents Key=Project,Value=accinfra \
            2>/dev/null || echo "Table already exists"

          echo "✅ DynamoDB lock table ready: ${{ env.TF_LOCK_TABLE }}"

      - name: Summary
        run: |
          echo "## ✅ Terraform Backend Bootstrapped" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Resource | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| S3 Bucket | \`${{ env.TF_STATE_BUCKET }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| DynamoDB Table | \`${{ env.TF_LOCK_TABLE }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Region | \`${{ env.AWS_REGION }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "You can now run the main deploy workflow." >> "$GITHUB_STEP_SUMMARY"
