Monitor GitHub repo Karu0606/sample_dashboard for new open issues with 'accinfra' in title (case-insensitive). Use GITHUB_TOKEN from user-level environment variable ([System.Environment]::GetEnvironmentVariable('GITHUB_TOKEN', 'User')).

Steps:
1. Read processed issue numbers from C:\Users\k.c.chockalingam\.kiro\crew\crons\accinfra_processed.json
2. Fetch open issues: GET https://api.github.com/repos/Karu0606/sample_dashboard/issues?state=open (Authorization: Bearer <token>)
3. Filter issues where title contains 'accinfra' (case-insensitive)
4. For each NEW issue NOT in processed list:
   a. Read the issue body to understand the infrastructure request
   b. Cross-check: Read comments/bodies of previously processed accinfra issues. If a prior issue had an identical or very similar request, reference it: "Similar to #X (estimated $Y/month)" and reuse that cost estimate.
   c. If genuinely new: Estimate the monthly AWS cost based on resources requested. Use current AWS pricing.
   d. If estimated cost < $30/month:
      - Add label "auto-approved" via POST /repos/Karu0606/sample_dashboard/issues/{number}/labels with body ["auto-approved"]
      - Post comment with cost breakdown in a markdown table (columns: Resource | Specification | Monthly Cost | Notes) and a Total row
      - End comment with: "Auto-approved (under $30/month threshold). This is triage only -- provisioning is separate."
   e. If estimated cost >= $30/month:
      - Add label "needs-approval" via POST /repos/Karu0606/sample_dashboard/issues/{number}/labels with body ["needs-approval"]
      - Post comment: " Budget Approval Required\n\nEstimated cost: $X/month (exceeds $30 auto-approval threshold).\n\n[cost breakdown table]\n\nPlease confirm budget approval to proceed. This is triage only -- no resources will be provisioned."
   f. Add the issue number to the processed list
5. Save updated processed list back to the JSON file
6. Stay SILENT if no new issues found. Report only when new issues are processed.

IMPORTANT: Only triage. Do NOT provision resources. Do NOT check for approval responses. Do NOT generate CloudFormation templates.

Use curl/Invoke-WebRequest with "Authorization: Bearer <token>" header for all GitHub API calls.
Comment endpoint: POST /repos/Karu0606/sample_dashboard/issues/{number}/comments with body {"body": "..."}
Label endpoint: POST /repos/Karu0606/sample_dashboard/issues/{number}/labels with body ["label-name"]
